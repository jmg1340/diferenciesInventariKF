<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diferències d'inventari K-F</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="text-center">Diferències d'inventaris entre FARHOS i KARDEX</h1>
	<br/><br/>
        {% if error %}
            <p class="alert alert-danger">{{ error }}</p>
        {% endif %}
        <form method="post" class="row g-3 align-items-center justify-content-center">
            <div class="col-auto">
                <label for="password" class="col-form-label">Pwd:</label>
            </div>
            <div class="col-3">
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Entrar</button>
            </div>
        </form>
    </div>
</body>
</html>
